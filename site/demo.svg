<text x="18.00" y="87.00" fill="#8b949e" class="a40" style="font-style:italic" xml:space="preserve">shipnotes: 7 commit(s) (since latest tag v1.4.0)</text>
<text x="18.00" y="127.00" fill="#79c0ff" class="a42" style="font-weight:600" xml:space="preserve"># acme-app — release notes</text>
<text x="18.00" y="167.00" fill="#8b949e" class="a44" style="font-style:italic" xml:space="preserve">_2026-07-19_</text>
<text x="18.00" y="207.00" fill="#ffa657" class="a46" style="font-weight:600" xml:space="preserve">## Breaking Changes</text>
<text x="18.00" y="247.00" fill="#e6edf3" class="a48" xml:space="preserve">- Remove the legacy v1 API</text>
<text x="18.00" y="287.00" fill="#ffa657" class="a50" style="font-weight:600" xml:space="preserve">## Features</text>
<text x="18.00" y="327.00" fill="#e6edf3" class="a52" xml:space="preserve">- Add CSV and Excel export for reports</text>
<text x="18.00" y="347.00" fill="#e6edf3" class="a53" xml:space="preserve">- Add dark mode across the dashboard</text>
<text x="18.00" y="387.00" fill="#ffa657" class="a55" style="font-weight:600" xml:space="preserve">## Fixes</text>
<text x="18.00" y="427.00" fill="#e6edf3" class="a57" xml:space="preserve">- Correct proration when upgrading mid-cycle</text>
<text x="18.00" y="447.00" fill="#e6edf3" class="a58" xml:space="preserve">- Stop the dropdown menu closing while scrolling on mobile</text>
<text x="18.00" y="487.00" fill="#ffa657" class="a60" style="font-weight:600" xml:space="preserve">## Improvements</text>
<text x="18.00" y="527.00" fill="#e6edf3" class="a62" xml:space="preserve">- Load the dashboard twice as fast on large workspaces</text>
